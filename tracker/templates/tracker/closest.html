{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closest - PolderExpress</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9992;&#65039;</text></svg>">
<link rel="stylesheet" href="{% static 'tracker/style.css' %}?v=2">
</head>
<body>

<header>
  <a class="back-link" href="/">&#8592; Tracker</a>
  <div class="status" id="status">
    <span class="dot"></span>
    <span id="status-text">Locating...</span>
  </div>
</header>

<div class="toolbar">
  <span class="closest-label">Closest Airborne</span>
  <button class="refresh-btn" id="refresh-btn">Refresh</button>
</div>

<div class="closest-content">
  <div class="closest-layout">
    <div id="closest-photo"></div>
    <div id="closest-body"></div>
  </div>
</div>

<div class="player-bar" id="player-bar">
  <div class="listening-indicator" id="listening-indicator" style="display:none"></div>
  <div class="player-info">
    <div class="player-callsign" id="player-callsign">--</div>
    <div class="player-feed" id="player-feed">LiveATC Feed</div>
  </div>
  <button class="player-btn" id="player-play" aria-label="Play/Pause">
    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
  </button>
  <input type="range" class="volume-slider" id="volume" min="0" max="100" value="80">
  <button class="player-close" id="player-close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  const API_URL = '/api/v1/closest/';
  const PHOTO_URL = '/api/v1/photo/';
  const REFRESH_MS = 15000;
  const PHOTO_REFRESH_MS = 5 * 60 * 1000;
  const RADIUS_KM = 15;

  const $ = (s) => document.querySelector(s);
  const audio = $('#audio');
  const bodyEl = $('#closest-body');
  const photoEl = $('#closest-photo');
  const statusEl = $('#status');
  const statusText = $('#status-text');
  const refreshBtn = $('#refresh-btn');
  const playerBar = $('#player-bar');
  const playerCallsign = $('#player-callsign');
  const playerFeed = $('#player-feed');
  const playerPlay = $('#player-play');
  const iconPlay = $('#icon-play');
  const iconPause = $('#icon-pause');
  const volumeSlider = $('#volume');
  const playerClose = $('#player-close');
  const listeningIndicator = $('#listening-indicator');

  let userLat = null;
  let userLon = null;
  let refreshTimer = null;
  let activeCallsign = null;
  let isPlaying = false;
  let lastPhotoHex = null;
  let lastPhotoAt = 0;
  let dismissedUrl = null;

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusText.textContent = text;
  }

  function formatAltitude(alt) {
    if (alt === 'ground') return '<span class="ground">GND</span>';
    if (alt == null) return '--';
    return Number(alt).toLocaleString();
  }

  function formatSpeed(s) {
    return s != null ? Math.round(s) : '--';
  }

  function formatDistance(d) {
    if (d == null) return '--';
    return d.toFixed(1);
  }

  function formatVertRate(v) {
    if (v == null) return '';
    if (v === 0) return '';
    const cls = v > 0 ? 'vr-up' : 'vr-down';
    const arrow = v > 0 ? '\u2191' : '\u2193';
    return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(v).toLocaleString() + '</span>';
  }

  function feedName(url) {
    if (!url) return 'No feed';
    const name = url.split('/').pop().replace('.mp3', '');
    return name;
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function routeHtml(p) {
    var r = p.route;
    if (!r) return '';
    var originCode = r.origin_iata || r.origin_icao;
    var destCode = r.destination_iata || r.destination_icao;
    if (!originCode && !destCode) return '';
    var originCity = [r.origin_city, r.origin_country].filter(Boolean).map(escapeHtml).join(', ');
    var destCity = [r.destination_city, r.destination_country].filter(Boolean).map(escapeHtml).join(', ');
    var airlineText = r.airline_name ? (r.airline_icao ? r.airline_name + ' (' + r.airline_icao + ')' : r.airline_name) : '';
    return '<div class="card-route">'
      + '<div class="route-line">'
      +   '<div class="route-airport">' + escapeHtml(originCode || '---') + '</div>'
      +   '<div class="route-arrow">\u2192</div>'
      +   '<div class="route-airport right">' + escapeHtml(destCode || '---') + '</div>'
      + '</div>'
      + '<div class="route-city">'
      +   '<span>' + (escapeHtml(originCity) || '\u00b7') + '</span>'
      +   '<span>' + (escapeHtml(destCity) || '\u00b7') + '</span>'
      + '</div>'
      + (airlineText ? '<div class="airline-tag">' + escapeHtml(airlineText) + '</div>' : '')
      + '</div>';
  }

  function photoHtml(photo) {
    if (!photo || !photo.url) return '';
    var link = photo.link ? '<a href="' + escapeHtml(photo.link) + '" target="_blank" rel="noopener">' : '';
    var linkClose = link ? '</a>' : '';
    return link
      + '<img class="closest-img" src="' + escapeHtml(photo.url) + '" alt="Aircraft photo" loading="lazy" onerror="this.remove()">'
      + linkClose
      + '<div class="closest-photo-credit">Photos by ' + escapeHtml(photo.photographer || 'unknown') + '</div>';
  }

  function closestStatsHtml(p) {
    var vert = formatVertRate(p.vertical_rate_fpm);
    return '<div class="closest-stats">'
      + '<div class="closest-stat"><div class="v">' + (p.aircraft_type ? escapeHtml(p.aircraft_type) : '\u2013') + '</div><div class="l">Aircraft</div></div>'
      + '<div class="closest-stat"><div class="v">' + formatAltitude(p.altitude_ft) + '</div><div class="l">Altitude ft</div></div>'
      + '<div class="closest-stat"><div class="v">' + formatSpeed(p.speed_knots) + '</div><div class="l">Speed kts</div></div>'
      + '<div class="closest-stat"><div class="v">' + formatDistance(p.distance_km) + '</div><div class="l">Distance km</div></div>'
      + '<div class="closest-stat"><div class="v">' + (p.bearing != null ? Math.round(p.bearing) + '\u00b0' : '\u2013') + '</div><div class="l">Bearing</div></div>'
      + (vert ? '<div class="closest-stat"><div class="v">' + vert + '</div><div class="l">Vert rate fpm</div></div>' : '')
      + '</div>';
  }

  function renderClosest(data, forcePhoto) {
    var p = data.plane;
    if (!p) {
      bodyEl.innerHTML = '<div class="empty">No qualifying aircraft.<br>No airborne plane with route data within ' + RADIUS_KM + ' km.</div>';
      photoEl.innerHTML = '';
      hidePlayer();
      return;
    }
    var meta = [p.tail_number].filter(Boolean).map(escapeHtml).join(' \u00b7 ');
    if (p.squawk) meta += ' \u00b7 Sqwk ' + escapeHtml(p.squawk);
    var freq = atcFreq(p);
    if (freq) meta += ' \u00b7 Freq ' + escapeHtml(freq);
    var html = '<div class="closest-hero">' + escapeHtml(p.callsign || p.hex_id) + '</div>';
    var callsignNameText = callsignName(p.callsign, p.route);
    if (callsignNameText) html += '<div class="closest-callsign-name">' + escapeHtml(callsignNameText) + '</div>';
    html += '<div class="closest-meta">' + meta + '</div>';
    html += '<div class="closest-route">' + routeHtml(p) + '</div>';
    html += closestStatsHtml(p);
    html += '<button class="closest-atc" id="closest-atc"' + (p.liveatc_stream_url ? '' : ' disabled') + '>' + (p.liveatc_stream_url ? 'Play ATC feed' : 'No ATC feed') + '</button>';
    bodyEl.innerHTML = html;
    var atc = document.getElementById('closest-atc');
    if (atc) atc.addEventListener('click', function () { startStream(p); });
    autoTune(p);
    maybeRefreshPhoto(p.hex_id, forcePhoto);
  }

  function maybeRefreshPhoto(hex, force) {
    if (!hex) { photoEl.innerHTML = ''; return; }
    var now = Date.now();
    if (!force && hex === lastPhotoHex && now - lastPhotoAt < PHOTO_REFRESH_MS) return;
    lastPhotoHex = hex;
    lastPhotoAt = now;
    fetch(PHOTO_URL + encodeURIComponent(hex) + '/', { headers: { 'Accept': 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (d) {
        photoEl.innerHTML = photoHtml(d.photo);
      })
      .catch(function () {
        photoEl.innerHTML = '';
      });
  }

  function fetchClosest(forcePhoto) {
    if (userLat == null || userLon == null) return;
    setStatus('loading', 'Finding closest...');
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: userLat, lon: userLon, radius: RADIUS_KM })
    })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (data) {
      renderClosest(data, !!forcePhoto);
      var label = data.plane ? (data.plane.callsign || data.plane.hex_id) : 'none';
      setStatus('', label + ' closest');
    })
    .catch(function (err) {
      bodyEl.innerHTML = '<div class="error-msg">Unable to reach closest endpoint.<br><small>' + err.message + '</small></div>';
      setStatus('error', 'Fetch failed');
    });
  }

  function atcFreq(plane) {
    return (plane && plane.liveatc_frequency) ? String(plane.liveatc_frequency) : '';
  }

  //TODO; surely a better way to do this
var CALLSIGNS = {
    AA: 'American', AAL: 'American',
    AC: 'Air Canada', ACA: 'Air Canada',
    AF: 'Air France', AFR: 'Air France',
    AI: 'Air India', AIC: 'Air India',
    AY: 'Finnair', FIN: 'Finnair',
    AZ: 'Alitalia', AZA: 'Alitalia',
    BA: 'Speedbird', BAW: 'Speedbird',
    CA: 'Air China', CCA: 'Air China',
    CI: 'China Airlines', CAL: 'China Airlines',
    CX: 'Cathay Pacific', CPA: 'Cathay Pacific',
    CZ: 'China Southern', CSN: 'China Southern',
    DL: 'Delta', DAL: 'Delta',
    DY: 'Norwegian', NAX: 'Norwegian',
    EI: 'Shamrock', EIN: 'Shamrock',
    EK: 'Emirates', UAE: 'Emirates',
    ET: 'Ethiopian', ETH: 'Ethiopian',
    EY: 'Etihad', ETD: 'Etihad',
    FI: 'Icelandair', ICE: 'Icelandair',
    FR: 'Ryanair', RYR: 'Ryanair',
    HU: 'Hainan', CHH: 'Hainan',
    HV: 'Transavia', TRA: 'Transavia',
    IB: 'Iberia', IBE: 'Iberia',
    JL: 'Japan Air', JAL: 'Japan Air',
    KE: 'Korean Air', KAL: 'Korean Air',
    KL: 'KLM', KLM: 'KLM',
    LH: 'Lufthansa', DLH: 'Lufthansa',
    LO: 'LOT', LOT: 'LOT',
    LS: 'Channex', EXS: 'Channex',
    LX: 'Swiss', SWR: 'Swiss',
    MS: 'Egyptair', MSR: 'Egyptair',
    MU: 'China Eastern', CES: 'China Eastern',
    NH: 'All Nippon', ANA: 'All Nippon',
    NZ: 'New Zealand', ANZ: 'New Zealand',
    OS: 'Austrian', AUA: 'Austrian',
    OU: 'Croatia', CTN: 'Croatia',
    QF: 'Qantas', QFA: 'Qantas',
    QR: 'Qatar', QTR: 'Qatar',
    SA: 'Springbok', SAA: 'Springbok',
    SK: 'Scandinavian', SAS: 'Scandinavian',
    SN: 'Bee-Line', BEL: 'Bee-Line',
    SQ: 'Singapore', SIA: 'Singapore',
    SU: 'Aeroflot', AFL: 'Aeroflot',
    SV: 'Saudia', SVA: 'Saudia',
    TK: 'Turkish', THY: 'Turkish',
    TP: 'TAP Air', TAP: 'TAP Air',
    TS: 'Air Transat', TSC: 'Air Transat',
    U2: 'Easy', EZY: 'Easy',
    UA: 'United', UAL: 'United',
    VS: 'Virgin Atlantic', VIR: 'Virgin Atlantic',
    W6: 'Wizz Air', WZZ: 'Wizz Air',
    WN: 'Southwest', SWA: 'Southwest',
    WS: 'WestJet', WJA: 'WestJet'
  };

  function callsignName(callsign, route) {
    if (route) {
      if (route.airline_iata && CALLSIGNS[route.airline_iata]) return CALLSIGNS[route.airline_iata];
      if (route.airline_icao && CALLSIGNS[route.airline_icao]) return CALLSIGNS[route.airline_icao];
    }
    if (!callsign) return '';
    var m = String(callsign).toUpperCase().match(/^([A-Z]{2,3})/);
    if (!m) return '';
    if (CALLSIGNS[m[1]]) return CALLSIGNS[m[1]];
    if (m[1].length === 3 && CALLSIGNS[m[1].slice(0, 2)]) return CALLSIGNS[m[1].slice(0, 2)];
    return '';
  }

  function startStream(plane) {
    if (!plane.liveatc_stream_url) return;
    activeCallsign = plane.callsign || plane.hex_id;
    audio.src = plane.liveatc_stream_url;
    audio.load();
    playerCallsign.textContent = plane.callsign || plane.hex_id;
    var parts = [feedName(plane.liveatc_stream_url), plane.aircraft_type, atcFreq(plane)].filter(Boolean);
    playerFeed.textContent = parts.join(' \u00b7 ');
    playerBar.classList.add('visible');
    updatePlayIcon();
    audio.play().catch(function () {
      isPlaying = false;
      updatePlayIcon();
    });
  }

  function autoTune(plane) {
    if (!plane || !plane.liveatc_stream_url) {
      hidePlayer();
      return;
    }
    if (audio.src === plane.liveatc_stream_url) return;
    if (dismissedUrl === plane.liveatc_stream_url) return;
    startStream(plane);
  }

  function hidePlayer() {
    audio.pause();
    audio.src = '';
    isPlaying = false;
    activeCallsign = null;
    playerBar.classList.remove('visible');
    updatePlayIcon();
  }

  function updatePlayIcon() {
    if (isPlaying) {
      iconPlay.style.display = 'none';
      iconPause.style.display = '';
      listeningIndicator.style.display = '';
    } else {
      iconPlay.style.display = '';
      iconPause.style.display = 'none';
      listeningIndicator.style.display = 'none';
    }
  }

  function onGeoSuccess(pos) {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    setStatus('', 'Located');
    fetchClosest();
    if (!refreshTimer) {
      refreshTimer = setInterval(function () {
        fetchClosest(false);
      }, REFRESH_MS);
    }
  }

  function onGeoError() {
    setStatus('error', 'Location denied');
    bodyEl.innerHTML = '<div class="error-msg">Location access is required to find nearby aircraft.<br>Please allow location access and reload.</div>';
  }

  playerPlay.addEventListener('click', function () {
    if (!audio.src) return;
    if (isPlaying) {
      audio.pause();
    } else {
      audio.play().catch(function () {
        isPlaying = false;
        updatePlayIcon();
      });
    }
  });

  audio.addEventListener('playing', function () {
    isPlaying = true;
    updatePlayIcon();
  });
  audio.addEventListener('pause', function () {
    isPlaying = false;
    updatePlayIcon();
  });
  audio.addEventListener('error', function () {
    isPlaying = false;
    dismissedUrl = audio.src || null;
    updatePlayIcon();
    playerFeed.textContent = 'Stream unavailable';
  });

  var savedVol = localStorage.getItem('atc-volume');
  var initialVol = savedVol !== null ? Number(savedVol) : 80;
  volumeSlider.value = initialVol;
  audio.volume = initialVol / 100;

  volumeSlider.addEventListener('input', function () {
    audio.volume = volumeSlider.value / 100;
    localStorage.setItem('atc-volume', volumeSlider.value);
  });

  playerClose.addEventListener('click', function () {
    dismissedUrl = audio.src || null;
    hidePlayer();
  });

  refreshBtn.addEventListener('click', function () {
    fetchClosest(true);
  });

  if (!navigator.geolocation) {
    setStatus('error', 'Geolocation not supported');
    bodyEl.innerHTML = '<div class="error-msg">Your browser does not support geolocation.</div>';
    return;
  }

  navigator.geolocation.getCurrentPosition(onGeoSuccess, onGeoError, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  });
})();
</script>
</body>
</html>
