{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closest - PolderExpress</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9992;&#65039;</text></svg>">
<link rel="stylesheet" href="{% static 'tracker/style.css' %}?v=4">
</head>
<body>

<header>
  <a class="back-link" href="/">&#8592; Tracker</a>
  <div class="status" id="status">
    <span class="dot"></span>
    <span id="status-text">Locating...</span>
  </div>
</header>

<div class="toolbar">
  <span class="closest-label">Closest Airborne</span>
  <button class="refresh-btn" id="refresh-btn">Refresh</button>
</div>

<div class="closest-content">
  <div class="closest-layout">
    <div class="closest-side">
      <div id="closest-photo"></div>
      <div class="map-wrap">
        <iframe
          id="map-frame"
          class="map-frame"
          src="https://adsb.lol/?kiosk&hideSideBar&enableLabels&lat=52.3086&lon=4.7639&zoom=11"
          title="Live aircraft map by adsb.lol"
          allowfullscreen></iframe>
      </div>
    </div>
    <div id="closest-body"></div>
  </div>
</div>

<div class="player-bar" id="player-bar">
  <div class="listening-indicator" id="listening-indicator" style="display:none"></div>
  <div class="player-info">
    <div class="player-callsign" id="player-callsign">--</div>
    <div class="player-feed" id="player-feed">LiveATC Feed</div>
  </div>
  <button class="player-btn" id="player-play" aria-label="Play/Pause">
    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
  </button>
  <input type="range" class="volume-slider" id="volume" min="0" max="100" value="80">
  <button class="player-close" id="player-close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<audio id="audio" preload="none"></audio>

<script type="module" src="{% static 'tracker/closest.js' %}"></script>
</body>
</html>
