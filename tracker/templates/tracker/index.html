{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolderExpress</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9992;&#65039;</text></svg>">
<link rel="stylesheet" href="{% static 'tracker/style.css' %}?v=2">
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px">
    <h1>Flight Tracker</h1>
    <a class="closest-btn" href="/closest/">Closest</a>
  </div>
  <div class="status" id="status">
    <span class="dot"></span>
    <span id="status-text">Locating...</span>
  </div>
</header>

<div class="container">
  <div class="info-bar">
    <span><span class="count" id="count">0</span> aircraft nearby</span>
    <button class="refresh-btn" id="refresh-btn" disabled>Refresh</button>
  </div>
  <div id="planes"></div>
</div>

<div class="player-bar" id="player-bar">
  <div class="listening-indicator" id="listening-indicator" style="display:none"></div>
  <div class="player-info">
    <div class="player-callsign" id="player-callsign">--</div>
    <div class="player-feed" id="player-feed">LiveATC Feed</div>
  </div>
  <button class="player-btn" id="player-play" aria-label="Play/Pause">
    <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
  </button>
  <input type="range" class="volume-slider" id="volume" min="0" max="100" value="80">
  <button class="player-close" id="player-close" aria-label="Close">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<audio id="audio" preload="none"></audio>

<script>
(function () {
  const API_URL = '/api/v1/nearby-planes/';
  const REFRESH_MS = 15000;
  const RADIUS_KM = 15;

  const $ = (s) => document.querySelector(s);
  const audio = $('#audio');
  const planesEl = $('#planes');
  const countEl = $('#count');
  const statusEl = $('#status');
  const statusText = $('#status-text');
  const refreshBtn = $('#refresh-btn');
  const playerBar = $('#player-bar');
  const playerCallsign = $('#player-callsign');
  const playerFeed = $('#player-feed');
  const playerPlay = $('#player-play');
  const iconPlay = $('#icon-play');
  const iconPause = $('#icon-pause');
  const volumeSlider = $('#volume');
  const playerClose = $('#player-close');
  const listeningIndicator = $('#listening-indicator');

  let userLat = null;
  let userLon = null;
  let refreshTimer = null;
  let activeCallsign = null;
  let isPlaying = false;
  let planesData = [];

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusText.textContent = text;
  }

  function formatAltitude(alt) {
    if (alt === 'ground') return '<span class="ground">GND</span>';
    if (alt == null) return '--';
    return Number(alt).toLocaleString();
  }

  function formatSpeed(s) {
    return s != null ? Math.round(s) : '--';
  }

  function formatDistance(d) {
    if (d == null) return '--';
    return d.toFixed(1);
  }

  function formatVertRate(v) {
    if (v == null) return '';
    if (v === 0) return '';
    const cls = v > 0 ? 'vr-up' : 'vr-down';
    const arrow = v > 0 ? '\u2191' : '\u2193';
    return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(v).toLocaleString() + '</span>';
  }

  function feedName(url) {
    if (!url) return 'No feed';
    const name = url.split('/').pop().replace('.mp3', '');
    return name;
  }

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function routeHtml(p) {
    var r = p.route;
    if (!r) return '';
    var originCode = r.origin_iata || r.origin_icao;
    var destCode = r.destination_iata || r.destination_icao;
    if (!originCode && !destCode) return '';
    var originCity = [r.origin_city, r.origin_country].filter(Boolean).map(escapeHtml).join(', ');
    var destCity = [r.destination_city, r.destination_country].filter(Boolean).map(escapeHtml).join(', ');
    var airlineText = r.airline_name ? (r.airline_icao ? r.airline_name + ' (' + r.airline_icao + ')' : r.airline_name) : '';
    return '<div class="card-route">'
      + '<div class="route-line">'
      +   '<div class="route-airport">' + escapeHtml(originCode || '---') + '</div>'
      +   '<div class="route-arrow">\u2192</div>'
      +   '<div class="route-airport right">' + escapeHtml(destCode || '---') + '</div>'
      + '</div>'
      + '<div class="route-city">'
      +   '<span>' + (escapeHtml(originCity) || '\u00b7') + '</span>'
      +   '<span>' + (escapeHtml(destCity) || '\u00b7') + '</span>'
      + '</div>'
      + (airlineText ? '<div class="airline-tag">' + escapeHtml(airlineText) + '</div>' : '')
      + '</div>';
  }

  function renderPlanes(planes) {
    if (!planes.length) {
      planesEl.innerHTML = '<div class="empty">No aircraft detected in range.<br>Make sure location access is enabled.</div>';
      return;
    }
    planesEl.innerHTML = '<div class="plane-grid">' + planes.map(function (p, i) {
      var key = p.callsign || p.hex_id;
      var isActive = key === activeCallsign;
      var emergencyHtml = p.emergency && p.emergency !== 'none'
        ? '<span class="emergency-badge">' + p.emergency.toUpperCase() + '</span>'
        : '';
      var vrHtml = formatVertRate(p.vertical_rate_fpm);
      var freqText = atcFreq(p) ? ' \u00b7 Freq ' + escapeHtml(atcFreq(p)) : '';
      return '<div class="plane-card' + (isActive ? ' active-stream' : '') + '" data-index="' + i + '">'
        + '<div class="card-top">'
        +   '<span class="callsign">' + escapeHtml(p.callsign || p.hex_id) + '</span>'
        +   emergencyHtml
        + '</div>'
        + '<div class="card-meta">'
        +   (p.tail_number || '') + (p.tail_number && p.aircraft_type ? ' \u00b7 ' : '')
        +   (p.aircraft_type || '')
        +   freqText
        + '</div>'
        + routeHtml(p)
        + '<div class="card-stats">'
        +   '<div class="stat"><div class="stat-value">' + formatAltitude(p.altitude_ft) + '</div><div class="stat-label">Alt ft</div></div>'
        +   '<div class="stat"><div class="stat-value">' + formatSpeed(p.speed_knots) + '</div><div class="stat-label">Spd kts</div></div>'
        +   '<div class="stat"><div class="stat-value">' + formatDistance(p.distance_km) + '</div><div class="stat-label">Dist km</div></div>'
        + '</div>'
        + (vrHtml ? '<div style="text-align:right;margin-top:6px;font-size:11px">' + vrHtml + '</div>' : '')
        + '</div>';
    }).join('') + '</div>';
  }

  function atcFreq(plane) {
    return (plane && plane.liveatc_frequency) ? String(plane.liveatc_frequency) : '';
  }

  function startStream(plane) {
    if (!plane.liveatc_stream_url) return;
    activeCallsign = plane.callsign || plane.hex_id;
    audio.src = plane.liveatc_stream_url;
    audio.load();
    showPlayer(plane);
    renderPlanes(planesData);
    audio.play().catch(function () {
      isPlaying = false;
      updatePlayIcon();
    });
  }

  function showPlayer(plane) {
    playerCallsign.textContent = plane.callsign || plane.hex_id;
    var parts = [feedName(plane.liveatc_stream_url), plane.aircraft_type, atcFreq(plane)].filter(Boolean);
    playerFeed.textContent = parts.join(' \u00b7 ');
    playerBar.classList.add('visible');
  }

  function hidePlayer() {
    audio.pause();
    audio.src = '';
    isPlaying = false;
    activeCallsign = null;
    playerBar.classList.remove('visible');
    updatePlayIcon();
    renderPlanes(planesData);
  }

  function updatePlayIcon() {
    if (isPlaying) {
      iconPlay.style.display = 'none';
      iconPause.style.display = '';
      listeningIndicator.style.display = '';
    } else {
      iconPlay.style.display = '';
      iconPause.style.display = 'none';
      listeningIndicator.style.display = 'none';
    }
  }

  function fetchPlanes() {
    if (userLat == null || userLon == null) return;
    setStatus('loading', 'Fetching...');
    refreshBtn.disabled = true;

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat: userLat, lon: userLon, radius: RADIUS_KM })
    })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (data) {
      planesData = data.planes || [];
      planesData.sort(function (a, b) {
        return (a.distance_km ?? 9999) - (b.distance_km ?? 9999);
      });
      countEl.textContent = planesData.length;
      renderPlanes(planesData);
      setStatus('', planesData.length + ' aircraft');
      refreshBtn.disabled = false;
    })
    .catch(function (err) {
      setStatus('error', 'Fetch failed');
      planesEl.innerHTML = '<div class="error-msg">Unable to reach flight data.<br><small>' + err.message + '</small></div>';
      refreshBtn.disabled = false;
    });
  }

  function onGeoSuccess(pos) {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    setStatus('', 'Located');
    fetchPlanes();
    if (!refreshTimer) {
      refreshTimer = setInterval(function () {
        fetchPlanes();
      }, REFRESH_MS);
    }
  }

  function onGeoError() {
    setStatus('error', 'Location denied');
    planesEl.innerHTML = '<div class="error-msg">Location access is required to find nearby aircraft.<br>Please allow location access and reload.</div>';
  }

  planesEl.addEventListener('click', function (e) {
    var card = e.target.closest('.plane-card');
    if (!card) return;
    var idx = parseInt(card.dataset.index, 10);
    var plane = planesData[idx];
    if (!plane) return;
    var key = plane.callsign || plane.hex_id;
    if (key === activeCallsign) {
      hidePlayer();
    } else {
      startStream(plane);
    }
  });

  playerPlay.addEventListener('click', function () {
    if (!audio.src) return;
    if (isPlaying) {
      audio.pause();
    } else {
      audio.play().catch(function () {
        isPlaying = false;
        updatePlayIcon();
      });
    }
  });

  audio.addEventListener('playing', function () {
    isPlaying = true;
    updatePlayIcon();
  });
  audio.addEventListener('pause', function () {
    isPlaying = false;
    updatePlayIcon();
  });
  audio.addEventListener('error', function () {
    isPlaying = false;
    updatePlayIcon();
    playerFeed.textContent = 'Stream unavailable';
  });

  var savedVol = localStorage.getItem('atc-volume');
  var initialVol = savedVol !== null ? Number(savedVol) : 80;
  volumeSlider.value = initialVol;
  audio.volume = initialVol / 100;

  volumeSlider.addEventListener('input', function () {
    audio.volume = volumeSlider.value / 100;
    localStorage.setItem('atc-volume', volumeSlider.value);
  });

  playerClose.addEventListener('click', hidePlayer);

  refreshBtn.addEventListener('click', function () {
    fetchPlanes();
  });

  if (!navigator.geolocation) {
    setStatus('error', 'Geolocation not supported');
    planesEl.innerHTML = '<div class="error-msg">Your browser does not support geolocation.</div>';
    return;
  }

  navigator.geolocation.getCurrentPosition(onGeoSuccess, onGeoError, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  });
})();
</script>
</body>
</html>
